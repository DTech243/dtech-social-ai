services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dtech_social_ai
      POSTGRES_USER: dtech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  api:
    build: ./infrastructure/docker/api
    env_file: .env
    depends_on: [db]
    ports:
      - "8000:8000"
volumes:
  postgres_data:
